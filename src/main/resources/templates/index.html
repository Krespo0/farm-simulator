<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Фермы</title>
    <!-- Подключаем Bootstrap для красивого вида без CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="text-center mb-4">🐄 Симулятор Деревенской Жизни 🐔</h1>

    <!-- Карточка статистики -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Текущая статистика фермы</h4>
        </div>
        <div class="card-body">
            <div class="row text-center">
                <div class="col-md-3">
                    <h5>🐄 Коровы</h5>
                    <h2 class="text-primary" th:text="${stats.cowCount}">0</h2>
                </div>
                <div class="col-md-3">
                    <h5>🐔 Куры</h5>
                    <h2 class="text-warning" th:text="${stats.chickenCount}">0</h2>
                </div>
                <div class="col-md-3">
                    <h5>🥛 Молоко (л)</h5>
                    <h2 class="text-info" th:text="${#numbers.formatDecimal(stats.totalMilkLiters, 1, 1)}">0.0</h2>
                </div>
                <div class="col-md-3">
                    <h5>🥚 Яйца (шт)</h5>
                    <h2 class="text-danger" th:text="${#numbers.formatDecimal(stats.totalEggs, 1, 0)}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Панель действий -->
    <div class="row">
        <!-- Сбор продукции -->
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h5 class="card-title">Собрать продукцию за день</h5>
                    <p class="card-text text-muted">Подоить коров и собрать яйца у кур.</p>
                    <form th:action="@{/collect}" method="post">
                        <button type="submit" class="btn btn-primary btn-lg">Собрать 🚜</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Покупка животных -->
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title text-center">Купить животных на рынке</h5>
                    <form th:action="@{/buy}" method="post" class="row g-3 justify-content-center">
                        <div class="col-auto">
                            <input type="number" class="form-control" name="cows" placeholder="Коров" min="0" value="0" style="width: 100px;">
                        </div>
                        <div class="col-auto">
                            <input type="number" class="form-control" name="chickens" placeholder="Кур" min="0" value="0" style="width: 100px;">
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-warning">Купить 🛒</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Кнопка инициализации -->
    <div class="text-center mt-4">
        <form th:action="@{/initialize}" method="post">
            <button type="submit" class="btn btn-outline-secondary"
                    onclick="return confirm('Это добавит 10 коров и 20 кур к текущим. Продолжить?')">
                🔄 Инициализировать ферму (10 коров, 20 кур)
            </button>
        </form>
    </div>

    <div class="text-center mt-4 text-muted">
        <small>Spring Boot + PostgreSQL + ООП + Thymeleaf</small>
    </div>
</div>
</body>
</html>
